# ARM64 Atomic Instructions

# ==================== Load-Acquire/Store-Release ====================

# LDAXR (Load-Acquire Exclusive Register)
- Name: "LDAXR_X_V0"
  Mnemonic: "LDAXR"
  Description: "Load-Acquire Exclusive Register (64-bit)"
  Opcode: "11001000"
  Format: "LOAD_STORE_EXCLUSIVE"
  Operands:
    size: ['3', 'size', '?']
    L: ['1', 'L', '?']
    Rs: ['31', 'Rs', '?']
    Rt2: ['31', 'Rt2', '?']

# STLXR (Store-Release Exclusive Register)
- Name: "STLXR_X_V0"
  Mnemonic: "STLXR"
  Description: "Store-Release Exclusive Register (64-bit)"
  Opcode: "11001000"
  Format: "LOAD_STORE_EXCLUSIVE"
  Operands:
    size: ['3', 'size', '?']
    L: ['0', 'L', '?']
    Rs: ['0', 'Rs', '?']
    Rt2: ['31', 'Rt2', '?']

# LDXR (Load Exclusive Register)
- Name: "LDXR_X_V0"
  Mnemonic: "LDXR"
  Description: "Load Exclusive Register (64-bit)"
