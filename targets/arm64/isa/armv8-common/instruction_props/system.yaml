# ARM64 System Instructions

# ==================== System Register Access ====================

# MRS (Move System Register)
- Name: "MRS_X_V0"
  Mnemonic: "MRS"
  Description: "Move System Register to General Register"
  Opcode: "110101010011"
  Format: "SYSTEM_REG"
  Operands:
    opc: ['0', 'opc', '?']

# MSR (Move to System Register)
- Name: "MSR_X_V0"
  Mnemonic: "MSR"
  Description: "Move General Register to System Register"
  Opcode: "110101010001"
  Format: "SYSTEM_REG"
  Operands:
    opc: ['1', 'opc', '?']

# ==================== Exception Generation ====================

# SVC (Supervisor Call)
- Name: "SVC_V0"
  Mnemonic: "SVC"
  Description: "Supervisor Call"
  Opcode: "11010100000"
  Format: "EXCEPTION"
  Operands:
    opc: ['0', 'opc', '?']
    opc2: ['0', 'opc2', '?']

# HVC (Hypervisor Call)
- Name: "HVC_V0"
  Mnemonic: "HVC"
  Description: "Hypervisor Call"
  Opcode: "11010100000"
  Format: "EXCEPTION"
  Operands:
    opc: ['0', 'opc', '?']
    opc2: ['2', 'opc2', '?']

# SMC (Secure Monitor Call)
- Name: "SMC_V0"
  Mnemonic: "SMC"
  Description: "Secure Monitor Call"
  Opcode: "11010100000"
  Format: "EXCEPTION"
  Operands:
    opc: ['0', 'opc', '?']
    opc2: ['3', 'opc2', '?']

# BRK (Breakpoint)
- Name: "BRK_V0"
  Mnemonic: "BRK"
  Description: "Breakpoint Instruction"
  Opcode: "11010100001"
  Format: "EXCEPTION"
  Operands:
    opc: ['0', 'opc', '?']
    opc2: ['0', 'opc2', '?']

# HLT (Halt)
- Name: "HLT_V0"
  Mnemonic: "HLT"
  Description: "Halt Instruction"
  Opcode: "11010100010"
  Format: "EXCEPTION"
  Operands:
    opc: ['0', 'opc', '?']
    opc2: ['0', 'opc2', '?']

# ==================== Memory Barriers ====================

# DMB (Data Memory Barrier)
- Name: "DMB_V0"
  Mnemonic: "DMB"
  Description: "Data Memory Barrier"
  Opcode: "1101010100"
  Format: "BARRIER"
  Operands:
    CRm: ['3', 'CRm', '?']
    op2: ['5', 'op2', '?']

# DSB (Data Synchronization Barrier)
- Name: "DSB_V0"
  Mnemonic: "DSB"
  Description: "Data Synchronization Barrier"
  Opcode: "1101010100"
  Format: "BARRIER"
  Operands:
    CRm: ['3', 'CRm', '?']
    op2: ['4', 'op2', '?']

# ISB (Instruction Synchronization Barrier)
- Name: "ISB_V0"
  Mnemonic: "ISB"
  Description: "Instruction Synchronization Barrier"
  Opcode: "1101010100"
  Format: "BARRIER"
  Operands:
    CRm: ['15', 'CRm', '?']
    op2: ['6', 'op2', '?']

