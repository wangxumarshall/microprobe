# ==================== Vector Load/Store ====================

# LDR (Vector)
- Name: "LDR_V_IMM_V0"
  Mnemonic: "LDR"
  Description: "Load Vector Register (Immediate offset)"
  Opcode: "00111100"
  Format: "LOAD_STORE_IMM"
  Operands:
    size: ['3', 'size', '?']
    opc: ['1', 'opc', '?']
    V: ['1', 'V', '?']
    opc2: ['1', 'opc2', '?']
    opc3: ['1', 'opc3', '?']

# STR (Vector)
- Name: "STR_V_IMM_V0"
  Mnemonic: "STR"
  Description: "Store Vector Register (Immediate offset)"
  Opcode: "00111100"
  Format: "LOAD_STORE_IMM"
  Operands:
    size: ['3', 'size', '?']
    opc: ['0', 'opc', '?']
    V: ['1', 'V', '?']
    opc2: ['1', 'opc2', '?']
    opc3: ['1', 'opc3', '?']

