# ARM64 SIMD/NEON Instructions

# ==================== Vector Arithmetic ====================

# ADD (Vector)
- Name: "ADD_V_V0"
  Mnemonic: "ADD"
  Description: "Vector Add"
  Opcode: "00101110"
  Format: "SIMD_DP_3REG"
  Operands:
    Q: ['1', 'Q', '?']
    U: ['0', 'U', '?']
    size: ['0', 'size', '?']

