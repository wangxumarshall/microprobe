  - "0_1"
  - "opc"
  - "0_10"
  - "Vn"
  - "Vd"
  Assembly: "OPC Vd, Vn"

- Name: "FP_DP_2REG"
  Description: "Floating Point Data Processing (2 Registers)"
  Fields:
  - "type"
  - "0_1"
  - "opc"
  - "Vm"
  - "0_5"
  - "Vn"
  - "Vd"
  Assembly: "OPC Vd, Vn, Vm"

- Name: "FP_COMPARE"
