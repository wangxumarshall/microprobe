  - "opc"
  - "Vm"
  - "0_10"
  - "Vn"
  - "0_5"
  Assembly: "OPC Vn, Vm"

- Name: "SIMD_DP_3REG"
  Description: "SIMD Data Processing (3 Registers)"
  Fields:
  - "Q"
  - "U"
  - "size"
  - "Vm"
  - "opc"
  - "Vn"
  - "Vd"
  Assembly: "OPC Vd, Vn, Vm"

- Name: "ATOMIC"
  Description: "Atomic memory operation"
  Fields:
  - "size"
  - "V"
  - "A"
  - "R"
  - "opc"
  - "Rs"
  - "Rt"
  - "Rn"
  Assembly: "OPC Rs, Rt, [Rn]"

- Name: "CAS"
  Description: "Compare and swap"
  Fields:
  - "size"
  - "V"
  - "A"
  - "R"
  - "opc"
  - "Rs"
  - "Rt"
  - "Rn"
  Assembly: "OPC Rs, Rt, [Rn]"

- Name: "SIMD_DP_1REG"
  Description: "SIMD Data Processing (1 Register)"
  Fields:
  - "Q"
  - "U"
  - "size"
  - "Vn"
  - "Vd"
  Assembly: "OPC Vd, Vn"

- Name: "SIMD_DP_2REG"
  Description: "SIMD Data Processing (2 Registers)"
  Fields:
  - "Q"
  - "U"
  - "size"
  - "Vn"
  - "Vd"
  Assembly: "OPC Vd, Vn"

- Name: "SYSTEM"
  Description: "System control instruction"
  Fields:
  - "0_1"
