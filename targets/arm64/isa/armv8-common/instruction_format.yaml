  - "op2"
  Assembly: "OPC"

- Name: "CACHE"
  Description: "Cache maintenance instruction"
  Fields:
  - "op1"
  - "CRm"
  - "op2"
  Assembly: "OPC"

- Name: "TLB"
  Description: "TLB maintenance instruction"
  Fields:
  - "op1"
  - "CRm"
  - "op2"
  Assembly: "OPC"

- Name: "HINT"
  Description: "Hint instruction"
