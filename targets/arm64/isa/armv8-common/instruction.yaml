    opc: ['0', 'opc', '?']
    V: ['0', 'V', '?']
    opc2: ['1', 'opc2', '?']
    opc3: ['1', 'opc3', '?']

# STR (Immediate, 32-bit)
- Name: "STR_W_IMM_V0"
  Mnemonic: "STR"
