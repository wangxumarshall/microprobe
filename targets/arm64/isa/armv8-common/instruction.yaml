# ==================== Branch ====================

# B (Unconditional)
- Name: "B_V0"
  Mnemonic: "B"
  Description: "Branch (unconditional)"
  Opcode: "0001"
  Format: "UNCOND_BRANCH_IMM"

# BL (Branch with Link)
- Name: "BL_V0"
  Mnemonic: "BL"
  Description: "Branch with Link"
  Opcode: "1001"
  Format: "UNCOND_BRANCH_IMM"
  ImplicitOperands:
    LR: ['LR', 'O']

# BR (Branch to Register)
- Name: "BR_V0"
  Mnemonic: "BR"
  Description: "Branch to Register"
  Opcode: "1101"
  Format: "UNCOND_BRANCH_REG"

# BLR (Branch with Link to Register)
- Name: "BLR_V0"
  Mnemonic: "BLR"
  Description: "Branch with Link to Register"
  Opcode: "1101"
  Format: "UNCOND_BRANCH_REG"
  ImplicitOperands:
    LR: ['LR', 'O']

# RET (Return)
- Name: "RET_V0"
  Mnemonic: "RET"
  Description: "Return from Subroutine"
  Opcode: "1101"
  Format: "UNCOND_BRANCH_REG"
  Operands:
    Rn: ['30', 'Rn', 'I']

# B.cond (Conditional Branch)
- Name: "B_COND_V0"
  Mnemonic: "B."
  Description: "Branch Conditional"
  Opcode: "0101"
  Format: "COND_BRANCH_IMM"

