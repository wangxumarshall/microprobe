# ==================== Load/Store ====================

# LDR (Immediate, 64-bit)
- Name: "LDR_X_IMM_V0"
  Mnemonic: "LDR"
  Description: "Load Register (64-bit, immediate offset)"
  Opcode: "1110"
  Format: "LOAD_STORE_IMM"
  Operands:
    size: ['3', 'size', '?']
    opc: ['1', 'opc', '?']
    V: ['0', 'V', '?']
    opc2: ['1', 'opc2', '?']
    opc3: ['1', 'opc3', '?']

# LDR (Immediate, 32-bit)
- Name: "LDR_W_IMM_V0"
  Mnemonic: "LDR"
  Description: "Load Register (32-bit, immediate offset)"
  Opcode: "1010"
  Format: "LOAD_STORE_IMM"
  Operands:
    size: ['2', 'size', '?']
    opc: ['1', 'opc', '?']
    V: ['0', 'V', '?']
    opc2: ['1', 'opc2', '?']
    opc3: ['1', 'opc3', '?']

