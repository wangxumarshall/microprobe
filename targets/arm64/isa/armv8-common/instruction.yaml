# ARM64 Core Instructions

# ==================== Data Processing - Immediate ====================

# ADD (Immediate)
- Name: "ADD_X_IMM_V0"
  Mnemonic: "ADD"
  Description: "Add (64-bit, immediate)"
  Opcode: "1000"
  Format: "ADD_SUB_IMM"
  Operands:
    sf: ['1', 'sf', '?']
    opc: ['0', 'opc', '?']
    S: ['0', 'S', '?']
    shift: ['0', 'shift', '?']

- Name: "ADD_W_IMM_V0"
  Mnemonic: "ADD"
  Description: "Add (32-bit, immediate)"
  Opcode: "0000"
  Format: "ADD_SUB_IMM"
  Operands:
    sf: ['0', 'sf', '?']
    opc: ['0', 'opc', '?']
    S: ['0', 'S', '?']
    shift: ['0', 'shift', '?']

